<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Merry Christmas</title>
    <style>
      body {
        background-color: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      svg {
        width: 90%;
        height: 68vh;
        visibility: hidden;
      }

      .main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .sparkle {
        /* mix-blend-mode:luminosity */
      }

      body {
        margin: 0;

        text-align: center;
        padding: 0;

        line-height: 2em;

        font-family: "Times New Roman", Times, serif;

        color: #000000;
      }

      #header {
        text-align: center;
        color: #C89568;
        font-family: "Times New Roman", Times, serif;
        font-size: 30px;
        width: 100%;
        min-width: 0;
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .header-item {
        opacity: 0;
        transition: all .5s ease-in-out;
        line-height: 1.5;
        margin: 0;
      }
      .header-item.show {
        opacity: 1;
      }
      #treeStarOutline {
        opacity: 0;
      }
      #mask {
        position: absolute;
        inset: 0;
        background-color: #000;
        width: 100%;
        height: 100%;
        font-size: clamp(80px, 22vw, 15rem);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* 只让树形图标晃动，避免整屏旋转导致移动端页面被放大 */
      .mask-emoji {
        display: inline-block;
        animation: shack 0.4s ease-in-out infinite;
      }

      @keyframes shack {
        0% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(-10deg);
        }
        50% {
          transform: rotate(0);
        }
        75% {
          transform: rotate(10deg);
        }
        100% {
          transform: rotate(0);
        }
      }
      #stars {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      @media (max-width: 768px) {
        body {
          line-height: 1.5;
        }

        svg {
          width: 100%;
          height: auto;
          max-height: 68vh;
        }

        #header {
          font-size: clamp(16px, 4.5vw, 24px);
          padding: 0 12px 12px;
          max-height: 30vh;
          overflow: hidden;
        }

        #mask {
          font-size: clamp(64px, 20vw, 120px);
        }
      }
    </style>
  </head>

  <script>
    function snow() {
      //  1、定义一片雪花模板
      var flake = document.createElement("div");
      // 雪花字符 ❄❉❅❆✻✼❇❈❊✥✺
      flake.innerHTML = "❆";
      // fixed 定位避免雪花超出视口后撑大移动端页面
      flake.style.cssText =
        "position:fixed;color:#fff;pointer-events:none;";

      //定义生成一片雪花的毫秒数
      var millisec = 100;
      //2、设置第一个定时器，周期性定时器，每隔一段时间（millisec）生成一片雪花；
      setInterval(function () {
        // 每次读取当前视口尺寸，兼容横竖屏切换
        var documentWidth = window.innerWidth,
          documentHieght = window.innerHeight;
        //页面加载之后，定时器就开始工作
        //随机生成雪花下落 开始 时left的值，相当于开始时X轴的位置
        var startLeft = Math.random() * documentWidth;

        //随机生成雪花下落 结束 时left的值，相当于结束时X轴的位置
        var endLeft = Math.random() * documentWidth;

        //随机生成雪花大小
        var flakeSize = 5 + 20 * Math.random();

        //随机生成雪花下落持续时间
        var durationTime = 4000 + 7000 * Math.random();

        //随机生成雪花下落 开始 时的透明度
        var startOpacity = 0.7 + 0.3 * Math.random();

        //随机生成雪花下落 结束 时的透明度
        var endOpacity = 0.2 + 0.2 * Math.random();

        //克隆一个雪花模板
        var cloneFlake = flake.cloneNode(true);

        //第一次修改样式，定义克隆出来的雪花的样式
        cloneFlake.style.cssText += `
                        left: ${startLeft}px;
                        opacity: ${startOpacity};
                        font-size:${flakeSize}px;
                        top:-25px;
                            transition:${durationTime}ms;
                    `;

        //拼接到页面中
        document.body.appendChild(cloneFlake);

        //设置第二个定时器，一次性定时器，
        //当第一个定时器生成雪花，并在页面上渲染出来后，修改雪花的样式，让雪花动起来；
        setTimeout(function () {
          //第二次修改样式
          cloneFlake.style.cssText += `
                                left: ${endLeft}px;
                                top:${documentHieght}px;
                                opacity:${endOpacity};
                            `;

          //4、设置第三个定时器，当雪花落下后，删除雪花。
          setTimeout(function () {
            cloneFlake.remove();
          }, durationTime);
        }, 0);
      }, millisec);
    }

      });
      var tl = gsap.timeline();
      tl.to(p, {

          gravity: gsap.utils.random(-6, 50),
        },
        scale: 0,
        rotation: gsap.utils.random(-123, 360),
        ease: "power1",
        onStart: flicker,
        onStartParams: [p],
        //repeat:-1,
        onRepeat: (p) => {
          gsap.set(p, {
            scale: getScale(),
          });
        },
        onRepeatParams: [p],
      });

      //
      //particlePool[particleCount].play();
      particleCount++;
      //mainTl.add(tl, i / 1.3)
      particleCount = particleCount >= numParticles ? 0 : particleCount;

    }

function drawStars() {
      let canvas = document.getElementById("stars"),
        ctx = canvas.getContext("2d"),
        w = (canvas.width = window.innerWidth),
        h = (canvas.height = window.innerHeight),
        hue = 37, //色调色彩
        stars = [], //保存所有星星
        count = 0, //用于计算星星
        maxStars = window.innerWidth < 768 ? 500 : 1300; //移动端减少星星数量，避免卡顿

      //canvas2是用来创建星星的源图像，即母版，
      //根据星星自身属性的大小来设置
      var canvas2 = document.createElement("canvas"),
        ctx2 = canvas2.getContext("2d");
      canvas2.width = 100;
      canvas2.height = 100;
      //创建径向渐变，从坐标(half，half)半径为0的圆开始，
      //到坐标为(half,half)半径为half的圆结束
      var half = canvas2.width / 2,
        gradient2 = ctx2.createRadialGradient(half, half, 0, half, half, half);
      gradient2.addColorStop(0.025, "#CCC");
      //hsl是另一种颜色的表示方式，
      //h->hue,代表色调色彩，0为red，120为green，240为blue
      //s->saturation，代表饱和度，0%-100%
      //l->lightness，代表亮度，0%为black，100%位white
      gradient2.addColorStop(0.1, "hsl(" + hue + ", 61%, 10%)");
      gradient2.addColorStop(0.25, "hsl(" + hue + ", 64%, 2%)");
      gradient2.addColorStop(1, "transparent");

      ctx2.fillStyle = gradient2;
      ctx2.beginPath();
      ctx2.arc(half, half, half, 0, Math.PI * 2);
      ctx2.fill();

      // End cache
      function random(min, max) {
        if (arguments.length < 2) {
          max = min;
          min = 0;
        }

        if (min > max) {
          var hold = max;
          max = min;
          min = hold;
        }

        //返回min和max之间的一个随机值
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function maxOrbit(x, y) {
        var max = Math.max(x, y),
          diameter = Math.round(Math.sqrt(max * max + max * max));
        //星星移动范围，值越大范围越小，
        return diameter / 2;
      }

      var Star = function () {
        //星星移动的半径
        this.orbitRadius = random(maxOrbit(w, h));
        //星星大小，半径越小，星星也越小，即外面的星星会比较大
        this.radius = random(60, this.orbitRadius) / 8;
        //所有星星都是以屏幕的中心为圆心
        this.orbitX = w / 2;
        this.orbitY = h / 2;
        //星星在旋转圆圈位置的角度,每次增加speed值的角度
        //利用正弦余弦算出真正的x、y位置
        this.timePassed = random(0, maxStars);
        //星星移动速度
        this.speed = random(this.orbitRadius) / 50000;
        //星星图像的透明度
        this.alpha = random(2, 10) / 10;

        count++;
        stars[count] = this;
      };

      Star.prototype.draw = function () {
        //星星围绕在以屏幕中心为圆心，半径为orbitRadius的圆旋转
        var x = Math.sin(this.timePassed) * this.orbitRadius + this.orbitX,
          y = Math.cos(this.timePassed) * this.orbitRadius + this.orbitY,
          twinkle = random(10);

        //星星每次移动会有1/10的几率变亮或者变暗
        if (twinkle === 1 && this.alpha > 0) {
          //透明度降低，变暗
          this.alpha -= 0.05;
        } else if (twinkle === 2 && this.alpha < 1) {
          //透明度升高，变亮
          this.alpha += 0.05;
        }

        ctx.globalAlpha = this.alpha;
        //使用canvas2作为源图像来创建星星，
        //位置在x - this.radius / 2, y - this.radius / 2
        //大小为 this.radius
        ctx.drawImage(
          canvas2,
          x - this.radius / 2,
          y - this.radius / 2,
          this.radius,
          this.radius
        );
        //没旋转一次，角度就会增加
        this.timePassed += this.speed;
      };

      //初始化所有星星
      for (var i = 0; i < maxStars; i++) {
        new Star();
      }

      function animation() {
        //以新图像覆盖已有图像的方式进行绘制背景颜色
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.9; //尾巴
        ctx.fillStyle = "hsla(" + hue + ", 64%, 6%, 2)";
        ctx.fillRect(0, 0, w, h);

        //源图像和目标图像同时显示，重叠部分叠加颜色效果
        ctx.globalCompositeOperation = "lighter";
        for (var i = 1, l = stars.length; i < l; i++) {
          stars[i].draw();
        }

        //调用该方法执行动画，并且在重绘的时候调用指定的函数来更新动画
        //回调的次数通常是每秒60次
        window.requestAnimationFrame(animation);
      }

      animation();

      // 横竖屏切换时重设画布，星星继续围绕新的屏幕中心旋转
      window.addEventListener("resize", function () {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        for (var i = 1; i < stars.length; i++) {
          if (stars[i]) {
            stars[i].orbitX = w / 2;
            stars[i].orbitY = h / 2;
          }
        }
      });
    }

    // music：公共领域的《We Wish You a Merry Christmas》器乐曲，本地托管避免外链失效
    // 音源：Wikimedia Commons（Anonimo - We Wish You a Merry Christmas.ogg 的 MP3 转码）
    let music_url = "./we-wish-you-a-merry-christmas.mp3";
    let _music = new Audio(music_url);
    _music.loop = true;
    _music.volume = 0.7;

    function start() {
      if (init_flag) return;
      init_flag = true;

      // 先移除遮罩，避免移动端点击后仍继续晃动
      let mask = document.getElementById("mask");
      if (mask) mask.remove();

      // 移动端浏览器可能拒绝播放，失败时不影响动画
      let playing = _music.play();
      if (playing && typeof playing.catch === "function") {
        playing.catch(function () {});
      }

      init();
      createParticles();
      drawStar();
      drawMain();
      mainTl.add(starTl, 0);
      gsap.globalTimeline.timeScale(1.5); //  圣诞树开始绘画时小光点动画的绘画速率，越大越快
      drawStars();
    }

    // 同时兼容鼠标、触摸和键盘；pointerdown 可避开移动端点击延迟
    window.addEventListener("pointerdown", start, { once: true });
    window.addEventListener("click", start, { once: true });
    window.addEventListener("keydown", start, { once: true });
  
  </script>
</html>
